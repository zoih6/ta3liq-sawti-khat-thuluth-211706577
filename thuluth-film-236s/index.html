<!doctype html>
<meta charset="utf-8">
<title>Thuluth - Sultan Al-Harf 236s - Cinematic Paper Collage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@900&display=swap');
  html,body{margin:0;background:#171615;overflow:hidden}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.77vh;margin:0 auto;background:#171615}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920, H=1080, DUR=236;
const g=document.getElementById('c').getContext('2d');

// === MOTION HELPERS - Pure function ===
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function spring(t,k=170,d=26){
  if(t<=0) return 0;
  const w0=Math.sqrt(k), z=d/(2*w0);
  if(z<1){ const wd=w0*Math.sqrt(1-z*z); return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t)); }
  return 1-Math.exp(-w0*t)*(1+w0*t);
}
const SNAPPY=[320,30], DEFAULT=[170,26], HEAVY=[90,20], PLAYFUL=[220,14];
function track(t,keys,k=170,d=26){
  let v=keys[0][1];
  for(let i=1;i<keys.length;i++) v+=(keys[i][1]-keys[i-1][1])*spring(t-keys[i][0],k,d);
  return v;
}
function swapAlpha(t,tIn,tOut){ return Math.min(clamp((t-tIn-0.08)/0.12), clamp((tOut-0.1-t)/0.1)); }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed ^ seed>>>15,1|seed); t=t+Math.imul(t ^ t>>>7,61|t)^t; return ((t ^ t>>>14)>>>0)/4294967296; }; }

// === COLORS ===
const C={ bg:'#171615', paper:'#E8DDC5', paper2:'#DCCCB0', brown:'#5A4634', gold:'#B89A58', goldLight:'#D4B878', white:'#F7F0E3', black:'#0A0908' };

// === DRAW HELPERS ===
function paperRect(x,y,w,h,r=18,rot=0,shadow=true){
  g.save(); g.translate(x+w/2,y+h/2); g.rotate(rot);
  if(shadow){ g.shadowColor='rgba(0,0,0,0.45)'; g.shadowBlur=24; g.shadowOffsetY=12; }
  g.fillStyle=C.paper;
  g.beginPath(); g.roundRect(-w/2,-h/2,w,h,r); g.fill();
  g.shadowColor='transparent';
  // torn fiber hint
  g.strokeStyle='rgba(90,70,52,0.12)'; g.lineWidth=1.2;
  g.stroke();
  // inner paper texture lines
  g.globalAlpha=0.04;
  g.strokeStyle=C.brown;
  for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(-w/2+20, -h/2+30+i*40); g.lineTo(w/2-20, -h/2+34+i*40); g.stroke(); }
  g.globalAlpha=1;
  g.restore();
}
function goldText(txt,x,y,size,alpha=1,glow=true){
  g.save(); g.globalAlpha=alpha; g.fillStyle=C.gold; g.font=`900 ${size}px Cairo, sans-serif`; g.direction='rtl'; g.textAlign='center';
  if(glow){ g.shadowColor='rgba(184,154,88,0.35)'; g.shadowBlur=18; }
  g.fillText(txt,x,y);
  if(glow){ g.shadowColor='transparent'; g.fillStyle=C.goldLight; g.globalAlpha=alpha*0.35; g.fillText(txt,x,y-2); }
  g.restore();
}
function bodyText(txt,x,y,size,alpha=1,color=C.white){
  g.save(); g.globalAlpha=alpha; g.fillStyle=color; g.font=`400 ${size}px Amiri, serif`; g.direction='rtl'; g.textAlign='center'; g.fillText(txt,x,y); g.restore();
}
function smallLabel(txt,x,y,size=22,alpha=0.85){
  g.save(); g.globalAlpha=alpha; g.fillStyle=C.brown; g.font=`400 ${size}px Amiri, serif`; g.direction='rtl'; g.textAlign='center'; g.fillText(txt,x,y); g.restore();
}

// === 22 SCENES ===
const SCENES=[
{from:0,to:10, draw(t){
  const fade=clamp(t*2.2), s=spring(t-0.2,...HEAVY), paperS=spring(t-0.15,...DEFAULT);
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  // subtle dust
  const rr=rng(1);
  g.fillStyle='rgba(232,221,197,0.018)';
  for(let i=0;i<140;i++){ g.fillRect(rr()*W, rr()*H, 1.2, 1.2); }
  const pw=1360*paperS, ph=540*paperS;
  paperRect(W/2-pw/2, H/2-ph/2-50, pw, ph, 22, 0.007*spring(t,...DEFAULT));
  g.save(); g.globalAlpha=fade;
  goldText('عَالَمُ الحَرفِ العَرَبِي', W/2, H/2-30, 88, fade);
  g.fillStyle=C.brown; g.globalAlpha=fade*0.9; g.font='400 32px Amiri, serif'; g.direction='rtl'; g.textAlign='center';
  g.fillText('مِئَاتُ الخُطُوطِ .. لَكِنَّ التَّاجَ لِوَاحِدٍ', W/2, H/2+75);
  const bar=spring(t-0.6,...SNAPPY); g.fillStyle=C.gold; g.globalAlpha=fade; g.fillRect(W/2-300*bar, H/2+108, 600*bar, 4);
  g.restore();
  // vignette light from top-left
  const lg=g.createLinearGradient(0,0,420,420); lg.addColorStop(0,'rgba(255,240,200,0.05)'); lg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=lg; g.fillRect(0,0,W,H);
}},
{from:10,to:20, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const s=spring(t-0.25,...HEAVY), s2=spring(t-0.55,...PLAYFUL);
  g.globalAlpha=0.065*clamp(t*1.2); g.fillStyle=C.paper; g.font='700 38px Amiri'; g.direction='rtl'; g.textAlign='center';
  for(let i=0;i<5;i++) g.fillText('بِسمِ اللهِ الرَّحمنِ الرَّحيمِ  •  مَخطُوطٌ عَتِيق', W/2, 260+i*165);
  g.globalAlpha=1;
  goldText('الـثُّـلُـث', W/2, H/2+30, 260*s);
  g.save(); g.globalAlpha=swapAlpha(t,0.9,9.5); bodyText('أَعظَمُ وَأَجمَلُ وَأَصعَبُ مَا أَبدَعَتهُ يَدُ خَطَّاط', W/2, H/2+150, 34, swapAlpha(t,0.9,9.5)); g.restore();
  const r=rng(11);
  for(let i=0;i<22;i++){ const a=r(), px=W/2+(a-0.5)*1000*s2, py=H/2+(r()-0.5)*520*s2; g.fillStyle='rgba(184,154,88,'+(0.14*s2)+')'; g.beginPath(); g.arc(px,py,1.6,0,Math.PI*2); g.fill(); }
}},
{from:20,to:30, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  paperRect(140,160,1640,760,20, -0.006);
  g.save(); g.translate(W/2, H/2+10);
  const drawC=spring(t-0.3,...DEFAULT);
  g.strokeStyle='rgba(184,154,88,0.92)'; g.lineWidth=2.2; g.globalAlpha=drawC;
  for(let i=0;i<5;i++){ g.beginPath(); g.arc(0,0, 70+i*62, 0, Math.PI*2*drawC); g.stroke(); }
  g.fillStyle=C.gold; g.beginPath(); g.arc(0,0,6*drawC,0,Math.PI*2); g.fill();
  g.fillStyle=C.brown; for(let i=0;i<7;i++){ const x=(i-3)*48*drawC; g.beginPath(); g.arc(x, 180, 7,0,Math.PI*2); g.fill(); }
  g.restore();
  goldText('دَولَةٌ لَهَا قَوَانِين', W/2, 240, 62, spring(t-0.1,...SNAPPY));
  bodyText('لَيسَ مُجَرَّدَ حُرُوفٍ تُرسَم', W/2, 870, 30, swapAlpha(t,0.4,9.6));
}},
{from:30,to:40, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const slide=spring(t-0.2,...SNAPPY);
  paperRect(120+ (1-slide)*140, 200, 820, 680, 18, -0.01);
  paperRect(980+ (1-spring(t-0.35,...SNAPPY))*140, 220, 820, 680, 18, 0.012);
  g.save(); g.translate(530, 520); g.rotate(-0.18*slide);
  g.fillStyle='#2B241E'; g.fillRect(-160,-18,320,36); g.fillStyle=C.brown; g.fillRect(120,-22,90,44);
  g.fillStyle=C.gold; g.font='900 22px Cairo'; g.direction='rtl'; g.textAlign='center'; g.fillText('القَصَبَة', 0, -55);
  g.restore();
  g.save(); g.globalAlpha=slide; g.fillStyle=C.brown; g.font='700 54px Amiri'; g.direction='rtl'; g.textAlign='center';
  g.fillText('خَطُّ الطُّومَارِ الكَبِير', 1390, 480);
  g.fillStyle=C.gold; g.fillRect(1220, 520, 340*slide, 3);
  g.fillStyle=C.white; g.font='400 28px Amiri'; g.fillText('قَطَبَةُ المُحَرِّر - العَصرُ الأُمَوِي', 1390, 580);
  g.restore();
}},
{from:40,to:50, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  paperRect(W/2-700, H/2-280, 1400, 560, 20, 0);
  const cut=track(t, [[0,30],[1.2,10]], 220,22);
  g.fillStyle=C.brown; g.fillRect(W/2-300, H/2-40, 600, cut);
  g.fillStyle=C.gold; g.font='900 28px Cairo'; g.direction='rtl'; g.textAlign='center'; g.fillText(cut.toFixed(0)+' px', W/2, H/2-70);
  const label=spring(t-1.5,...HEAVY); goldText('قُطِعَ ثُلُثُه', W/2, H/2+140, 92*label);
  bodyText('وَمِن هُنَا جَاءَ الاسم', W/2, H/2+210, 30, swapAlpha(t,1.7,9.7));
}},
{from:50,to:60, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const s=spring(t-0.2,...DEFAULT), s2=spring(t-0.5,...HEAVY);
  paperRect(100,140, 860, 800, 18, -0.008);
  g.save(); g.translate(530, 540); g.globalAlpha=s;
  g.fillStyle='#2A211C'; g.beginPath(); g.arc(0,0,180,0,Math.PI*2); g.fill();
  g.fillStyle=C.gold; g.font='700 32px Amiri'; g.direction='rtl'; g.textAlign='center'; g.fillText('ابنُ مُقلَة',0,12);
  g.strokeStyle='rgba(184,154,88,0.9)'; g.lineWidth=3; g.stroke();
  g.restore();
  goldText('النِّسَبُ الهَندَسِيَّة', 1380, 380, 72*s2);
  g.save(); g.globalAlpha=s2; g.fillStyle=C.white; g.font='400 26px Amiri'; g.direction='rtl'; g.textAlign='center';
  g.fillText('الأَلِفُ = سَبعُ نِقَاطٍ', 1380, 460);
  g.fillText('وَضَعَ أَعظَمَ مَنظُومَةٍ فِي التَّارِيخ', 1380, 510);
  g.strokeStyle='rgba(184,154,88,0.8)'; g.lineWidth=1.6; g.beginPath(); g.arc(1380,650, 80*s2,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(1380,650, 140*s2,0,Math.PI*2); g.stroke();
  g.restore();
}},
{from:60,to:70, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const tear=spring(t-0.4,...DEFAULT);
  paperRect(80,120, 1760, 840, 20, 0);
  g.save(); g.globalAlpha=tear; g.strokeStyle=C.brown; g.lineWidth=2; g.setLineDash([12,10]);
  g.beginPath(); g.moveTo(W/2, 140); g.lineTo(W/2+ (Math.sin(t*2)*20), 960); g.stroke(); g.setLineDash([]);
  g.fillStyle=C.brown; g.font='700 34px Amiri'; g.direction='rtl'; g.textAlign='center'; g.fillText('ابنُ البَوَّابِ يُهَذِّبُ البِنَاء', 520, 500);
  g.fillStyle=C.gold; g.font='900 54px Cairo'; g.fillText('العَصرُ الذَّهَبِيُّ العُثمَانِي', 1390, 500);
  g.fillStyle=C.white; g.font='400 26px Amiri'; g.fillText('القُبَّةُ وَالمِحرَابُ', 1390, 550);
  g.restore();
  const sweep=track(t, [[0,-400],[1.2,2400]], 120,20); g.fillStyle='rgba(212,184,120,0.07)'; g.fillRect(sweep-300,0,300,H);
}},
{from:70,to:80, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const a1=spring(t-0.2,...PLAYFUL), a2=spring(t-0.45,...PLAYFUL);
  g.save(); g.translate(620,540); g.scale(a1,a1); g.rotate(-0.06);
  g.fillStyle=C.paper; g.beginPath(); g.roundRect(-260,-160,520,320,24); g.fill();
  g.fillStyle=C.gold; g.font='900 48px Cairo'; g.textAlign='center'; g.direction='rtl'; g.fillText('الحَافِظُ عُثمَان',0,18);
  g.strokeStyle=C.brown; g.lineWidth=2.5; g.beginPath(); g.roundRect(-250,-150,500,300,18); g.stroke();
  g.restore();
  g.save(); g.translate(1300,540); g.scale(a2,a2); g.rotate(0.06);
  g.fillStyle='#1E1A16'; g.beginPath(); g.roundRect(-260,-160,520,320,24); g.fill();
  g.fillStyle=C.gold; g.font='900 46px Cairo'; g.textAlign='center'; g.fillText('مُحَمَّد شَوقِي',0,18);
  g.fillStyle=C.white; g.font='400 22px Amiri'; g.fillText('سُلطَانُ الحَرف',0,55);
  g.strokeStyle=C.gold; g.lineWidth=2; g.beginPath(); g.roundRect(-250,-150,500,300,18); g.stroke();
  g.restore();
  const q=spring(t-1.0,...HEAVY); g.fillStyle=C.white; g.font='900 52px Cairo'; g.direction='rtl'; g.textAlign='center'; g.globalAlpha=q*0.95; g.fillText('لِمَاذَا هُوَ الأَصعَبُ ؟', W/2, 880); g.globalAlpha=1;
}},
{from:80,to:90, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  paperRect(W/2-720, H/2-300, 1440, 600, 20, 0.005);
  const shake = t>1.2 ? Math.sin((t-1.2)*42)*6*Math.exp(-(t-1.2)*4) : 0;
  g.save(); g.translate(shake,0);
  goldText('الخَطَأُ لا يُغتَفَر', W/2, H/2-20, 92, 1);
  g.fillStyle=C.brown; g.font='400 28px Amiri'; g.direction='rtl'; g.textAlign='center'; g.fillText('إِهمَالٌ بَسِيطٌ يُشَوِّهُ لَوحَةً بِأَكمَلِهَا', W/2, H/2+70);
  g.restore();
  const drop=spring(t-1.0,...HEAVY); g.fillStyle='#0A0908'; g.globalAlpha=drop; g.beginPath(); g.arc(W/2+260*drop, H/2+190, 14*drop,0,Math.PI*2); g.fill();
  g.fillStyle='rgba(0,0,0,0.18)'; g.globalAlpha=drop; g.beginPath(); g.ellipse(W/2+260*drop, H/2+215, 22,6,0,0,Math.PI*2); g.fill(); g.globalAlpha=1;
}},
{from:90,to:100, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const stretch=track(t, [[0,1],[0.9,1.65]], 140,18);
  g.save(); g.translate(W/2, H/2); g.scale(1, stretch);
  goldText('ا  ل', 0, 18, 220, 1);
  g.restore();
  g.save(); g.globalAlpha=spring(t-0.7,...DEFAULT);
  g.strokeStyle=C.gold; g.lineWidth=4; g.beginPath();
  g.moveTo(680, 720); g.bezierCurveTo(820, 560, 1100, 880, 1240, 700); g.stroke();
  g.fillStyle=C.white; g.font='400 28px Amiri'; g.direction='rtl'; g.textAlign='center'; g.fillText('حُرُوفٌ مَمْشُوقَةٌ وَانحِنَاءَاتٌ وَاسِعَة', W/2, 880);
  g.restore();
}},
{from:100,to:110, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const s=spring(t-0.2,...SNAPPY), s2=spring(t-0.55,...SNAPPY);
  g.save(); g.translate(660,540); g.scale(s,s);
  g.fillStyle=C.brown; g.fillRect(-220,-28,440,56); g.fillStyle=C.gold; g.font='900 26px Cairo'; g.textAlign='center'; g.fillText('40 px',0,-52);
  g.fillStyle=C.white; g.font='400 22px Amiri'; g.fillText('القَلَمُ الأَصلِي',0,78);
  g.restore();
  g.save(); g.translate(1260,540); g.scale(s2,s2);
  g.fillStyle=C.gold; g.fillRect(-90,-14,180,28); g.fillStyle=C.brown; g.font='900 20px Cairo'; g.textAlign='center'; g.fillText('10 px',0,-38);
  g.fillStyle=C.white; g.font='400 22px Amiri'; g.fillText('قَلَمُ الحَرَكَاتِ ¼',0,78);
  g.restore();
  for(let i=0;i<3;i++){ const p=spring(t-0.9-i*0.18,...PLAYFUL); g.fillStyle=C.gold; g.globalAlpha=p; g.font='900 54px Amiri'; g.direction='rtl'; g.textAlign='center'; g.fillText('َ  ُ  ِ', W/2-70+i*70, H/2-180); } g.globalAlpha=1;
  bodyText('الحَرَكَاتُ بِقَلَمٍ آخَر', W/2, 880, 30, swapAlpha(t,0.3,9.5));
}},
{from:110,to:120, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  paperRect(W/2-720, H/2-300, 1440, 600, 20, 0);
  const bal=track(t, [[0,-12],[1.4,12],[2.8,0]], 90,16);
  g.save(); g.translate(W/2, H/2);
  g.rotate(bal*Math.PI/180);
  g.fillStyle=C.bg; g.fillRect(-520,-16,1040,32);
  g.fillStyle=C.paper2; g.fillRect(-420,-160,360,120); g.fillStyle=C.gold; g.globalAlpha=0.18; g.fillRect(-420,-160,360,120); g.globalAlpha=1;
  g.fillStyle=C.bg; g.fillRect(60,-140,360,100);
  g.fillStyle=C.gold; g.font='900 42px Cairo'; g.direction='rtl'; g.textAlign='center'; g.fillText('فَرَاغ', -240,-82);
  g.fillStyle=C.white; g.fillText('اِمتِلَاء', 240,-72);
  g.fillStyle=C.brown; g.beginPath(); g.moveTo(0,16); g.lineTo(-22,62); g.lineTo(22,62); g.closePath(); g.fill();
  g.restore();
  goldText('الحَـمْـل', W/2, 880, 64, spring(t-0.5,...HEAVY));
}},
{from:120,to:130, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  goldText('تِسعَةُ عَوَالِم', W/2, 210, 56, spring(t-0.2,...HEAVY));
  const gap=track(t, [[0, 22],[0.7, 110]], 170,22);
  g.fillStyle=C.gold; g.font='900 92px Amiri'; g.direction='rtl'; g.textAlign='center';
  const base=W/2- (gap*1.5); for(let i=0;i<4;i++) g.fillText('ا', base + i*gap, H/2+40);
  bodyText('1 — الثُّلُثُ المُفَرَّقُ  •  حُرُوفٌ مُتَبَاعِدَةٌ', W/2, 820, 30, swapAlpha(t,0.5,9.5));
  g.fillStyle='rgba(184,154,88,0.25)'; g.fillRect(W/2-360, H/2+90, 720, 2);
}},
{from:130,to:140, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const stack=track(t, [[0,0],[0.9,1]], 140,18);
  paperRect(W/2-640, H/2-260, 1280, 520, 20, 0);
  g.save(); g.globalAlpha=1; g.fillStyle=C.brown; g.font='900 74px Cairo'; g.direction='rtl'; g.textAlign='center';
  g.globalAlpha=0.95; g.fillText('محمد', W/2-70*stack, H/2-10);
  g.globalAlpha=0.55; g.fillText('محمد', W/2+70*stack, H/2+40);
  g.globalAlpha=0.35; g.fillText('محمد', W/2+10*stack, H/2+85);
  g.restore();
  bodyText('2 — الوَسَطُ  •  3 — المُشَبَّكُ المُدمَجُ', W/2, 830, 28, swapAlpha(t,0.3,9.5));
}},
{from:140,to:150, draw(t){
  g.fillStyle='#0F0E0D'; g.fillRect(0,0,W,H);
  const scale=track(t, [[0,0.85],[2.2,1.08]], 60,14);
  g.save(); g.translate(W/2,H/2); g.scale(scale,scale);
  g.fillStyle='#1C1A18'; g.fillRect(-760,-360,1520,720);
  g.fillStyle='rgba(255,255,255,0.035)'; for(let i=0;i<6;i++) g.fillRect(-760+i*260, -360, 2, 720);
  goldText('الـجَـلِـيّ', 0, 32, 300, 1);
  g.fillStyle='rgba(0,0,0,0.32)'; g.fillRect(-760, 220, 1520, 140);
  g.restore();
  bodyText('بِأَقلَامٍ عَرِيضَةٍ عَلَى جُدرَانِ المَسَاجِدِ وَالقِبَاب', W/2, 900, 26, swapAlpha(t,0.6,9.6));
}},
{from:150,to:160, draw(t){
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  const p1=spring(t-0.1,...SNAPPY), p2=spring(t-0.45,...SNAPPY), p3=spring(t-0.8,...SNAPPY);
  g.save(); g.translate(480,540); g.scale(p1,p1); paperRect(-320,-200,640,400,16, -0.01);

function draw(t){
  const ct = Math.max(0, Math.min(DUR-0.001, t));
  g.fillStyle=C.bg; g.fillRect(0,0,W,H);
  for(const s of SCENES) if(ct>=s.from && ct < s.to) s.draw(ct - s.from);
  const lg=g.createLinearGradient(0,0,420,420); lg.addColorStop(0,'rgba(255,240,200,0.06)'); lg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=lg; g.fillRect(0,0,W,H);
}

if(!navigator.webdriver){
  let t0=performance.now();
  (function loop(){ draw(((performance.now()-t0)/1000)%DUR); requestAnimationFrame(loop); })();
}
